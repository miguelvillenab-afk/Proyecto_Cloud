services:
  db_users:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5433:5432" ##5433 es el puerto local y se mapea al 5432 de postgresql (no modificar)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api_users:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db_users:
        condition: service_healthy
    restart: on-failure:5

volumes:
  postgres_data:
