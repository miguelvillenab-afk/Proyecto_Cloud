version: '3.8'

services:
  db_users:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5433:5432" ##5433 es el puerto local y se mapea al 5432 de postgresql (no modificar)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api_users:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db_users

volumes:
  postgres_data:
