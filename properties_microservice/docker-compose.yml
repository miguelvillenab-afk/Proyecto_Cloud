version: '3.8'

services:
  db_properties:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306" ##3307 es el puerto local y se mapea al 3306 de mysql (no modificar)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api_properties:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - db_properties

volumes:
  mysql_data:
