# docker-compose.prod.db.yml — corre SOLO en la 3ra MV (MV-DB privada)
# No publica puertos al exterior. Solo expone dentro de la VPC.
# Uso en MV-DB: docker compose -f docker-compose.prod.db.yml --env-file .env.prod up -d --build
services:
  db_users:
    image: postgres:15
    env_file:
      - .env.prod
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./user_microservice/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db_properties:
    image: mysql:8.0
    env_file:
      - .env.prod
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./properties_microservice/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db_reservations:
    image: mongo:6
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
